<nav class="fixed top-4 left-1/2 z-50 w-[95%] max-w-7xl -translate-x-1/2">
<div
  class="group flex items-center justify-between
         px-6 py-3
         bg- neutral/70 backdrop-blur-xl
         border border-white/6 rounded-2xl
         shadow-2xl shadow-black/40
         transition-all duration-300 ease-out
         hover:px-8 hover:py-4 hover:scale-[1.03]"
>

    <div  class="flex items-center gap-2 transition-all duration-300">
      <img
        src="/LimaLogo-removebg-preview.png"
        alt="Lima Comunicação"
        class="h-10 w-auto rounded-lg
               transition-all duration-300 ease-out
               group-hover:h-12 group-hover:scale-105"
      />
    </div>

<!-- Botão hamburguer (mobile) -->
<button
      class="md:hidden relative group/btn
             flex flex-col justify-center items-center gap-1.5
             w-12 h-12 rounded-xl
             bg-white/5 border border-white/10
             transition-all duration-300
             hover:bg-lime-300 hover:border-lime-300 hover:scale-105"
      (click)="toggleMenu()"
      aria-label="Abrir menu"
    >
      <span 
        class="w-6 h-0.5 rounded-full bg-lime-300 transition-all duration-300 origin-center group-hover/btn:bg-black"
        [class.rotate-45]="menuOpen"
        [class.translate-y-2]="menuOpen"
      ></span>
      
      <span 
        class="w-6 h-0.5 rounded-full bg-lime-300 transition-all duration-300 group-hover/btn:bg-black"
        [class.opacity-0]="menuOpen"
        [class.translate-x-4]="menuOpen"
      ></span>
      
      <span 
        class="w-6 h-0.5 rounded-full bg-lime-300 transition-all duration-300 origin-center group-hover/btn:bg-black"
        [class.-rotate-45]="menuOpen"
        [class.-translate-y-2]="menuOpen"
      ></span>
    </button>


    <ul class="hidden items-center gap-8 md:flex transition-all duration-300 ">
      <li>
        <a
          href="#about"
  class="relative text-sm font-medium text-white/80
         transition-colors duration-300
         hover:text-lime-300
         after:absolute after:left-0 after:-bottom-1
         after:h-[2px] after:w-0
         after:bg-lime-300
         after:transition-all after:duration-300
         hover:after:w-full"
>
          Quem somos
        </a>
      </li>

      <li>
        <a
          href="#services"
  class="relative text-sm font-medium text-white/80
         transition-colors duration-300
         hover:text-lime-300
         after:absolute after:left-0 after:-bottom-1
         after:h-[2px] after:w-0
         after:bg-lime-300
         after:transition-all after:duration-300
         hover:after:w-full"
>
          Serviços
        </a>
      </li>

      <li>
        <a
          href="#clients"
  class="relative text-sm font-medium text-white/80
         transition-colors duration-300
         hover:text-lime-300
         after:absolute after:left-0 after:-bottom-1
         after:h-[2px] after:w-0
         after:bg-lime-300
         after:transition-all after:duration-300
         hover:after:w-full"
>
          Clientes
        </a>
      </li>

      <li>
        <a
          href="#contact"
          class="rounded-xl bg-lime-300 px-5 py-2
                 text-sm font-bold text-black
                 transition-all duration-300
                 hover:bg-lime-400 hover:scale-105
                 hover:shadow-[0_0_25px_rgba(190,242,100,0.4)]"
        >
          Contato
        </a>
      </li>
    </ul>
  </div>

   <!-- Menu mobile -->
<div
  *ngIf="menuOpen"
class="absolute top-[120%] left-0 w-full
             rounded-3xl
             bg-[#0f0418]/90 backdrop-blur-xl border border-white/10
             shadow-[0_10px_40px_-10px_rgba(0,0,0,0.8)]
             overflow-hidden
             z-40
             animate-menu-container"
>
  <ul class="flex flex-col text-center py-6 px-4 divide-white/10">
    <li>
      <a
        href="#about"
        (click)="closeMenu()"
        class="block px-6 py-4 text-white/80 hover:text-lime-300 transition"
      >
        Quem somos
      </a>
    </li>

    <li>
      <a
        href="#services"
        (click)="closeMenu()"
        class="block px-6 py-4 text-white/80 hover:text-lime-300 transition"
      >
        Serviços
      </a>
    </li>

    <li>
      <a
        href="#clients"
        (click)="closeMenu()"
        class="block px-6 py-4 text-white/80 hover:text-lime-300 transition"
      >
        Clientes
      </a>
    </li>

    <li>
      <a
        href="#contact"
        (click)="closeMenu()"
        class="block px-6 py-4
               font-bold text-black
               bg-lime-300 hover:bg-lime-400 transition"
      >
        Contato
      </a>
    </li>
  </ul>
</div>


</nav>
