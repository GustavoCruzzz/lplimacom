<div class="fixed bottom-6 right-6 z-50">

  <button
    (click)="open = !open"
    class="rounded-full bg-lime-300 p-4 text-black shadow-xl
           hover:bg-lime-400 transition"
  >
    +
  </button>

  <div
    *ngIf="open"
    class="mt-4 flex flex-col gap-3 items-end"
  >
    <a class="bg-neutral-900 text-white px-4 py-2 rounded-xl">Instagram</a>
    <a class="bg-neutral-900 text-white px-4 py-2 rounded-xl">WhatsApp</a>
    <a class="bg-neutral-900 text-white px-4 py-2 rounded-xl">LinkedIn</a>
  </div>

</div>
