<div class="fixed bottom-8 right-8 z-50 flex flex-col items-end gap-4">

  <div
    *ngIf="open"
    class="flex flex-col gap-3 transition-all duration-300 origin-bottom-right"
  >
    <a href="#" class="flex items-center gap-3 bg-[#2d1b4e]/90 backdrop-blur-md border border-white/10 text-white px-5 py-3 rounded-2xl shadow-xl hover:bg-lime-300 hover:text-black transition group">
      <span class="font-medium">WhatsApp</span>
      <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M12 0a12 12 0 1 0 12 12A12 12 0 0 0 12 0zm0 22a10 10 0 1 1 10-10 10 10 0 0 1-10 10z"/></svg>
    </a>

    <a href="#" class="flex items-center gap-3 bg-[#2d1b4e]/90 backdrop-blur-md border border-white/10 text-white px-5 py-3 rounded-2xl shadow-xl hover:bg-lime-300 hover:text-black transition group">
      <span class="font-medium">Instagram</span>
      <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2.16c3.2 0 3.58.01 4.85.07 3.25.15 4.77 1.69 4.92 4.92.06 1.27.07 1.65.07 4.85s-.01 3.58-.07 4.85c-.15 3.23-1.66 4.77-4.92 4.92-1.27.06-1.64.07-4.85.07s-3.58-.01-4.85-.07c-3.26-.15-4.77-1.7-4.92-4.92-.06-1.27-.07-1.64-.07-4.85s.01-3.58.07-4.85C2.38 3.92 3.9 2.38 7.15 2.23c1.27-.06 1.65-.07 4.85-.07z"/></svg>
    </a>
  </div>

  <button
    (click)="open = !open"
    class="relative group rounded-full bg-lime-300 p-4 text-black shadow-[0_0_20px_rgba(190,242,100,0.4)]
           hover:bg-lime-400 hover:scale-110 transition-all duration-300 z-50"
  >
    <span class="absolute inset-0 rounded-full bg-lime-300 opacity-75 animate-ping group-hover:animate-none"></span>
    
    <div class="relative relative z-10">
        <svg *ngIf="!open" xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" />
        </svg>

        <svg *ngIf="open" xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
    </div>
  </button>

</div>
